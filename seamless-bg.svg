<svg viewBox="0 0 1200 80" width="1200" height="80" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- moving glow band -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(59,130,246,0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="80" fill="url(#g)"/>

  <!-- animated light sweep -->
  <rect x="-300" y="0" width="300" height="80" fill="url(#shine)" filter="url(#blur)">
    <animate attributeName="x"
      from="-300"
      to="1200"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>

  <!-- subtle noise dots -->
  <g opacity="0.06">
    <circle cx="120" cy="30" r="1"/>
    <circle cx="400" cy="60" r="1"/>
    <circle cx="700" cy="20" r="1"/>
    <circle cx="980" cy="50" r="1"/>
  </g>

</svg>
