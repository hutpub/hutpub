<svg viewBox="0 0 1200 420" width="1200" height="420" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">

      <style>
        .container {
          width: 1200px;
          height: 420px;
          background: radial-gradient(circle at 20% 20%, #1a1c1f, #0b0c0e);
background-image:
  linear-gradient(
    90deg,
    transparent 0,
    transparent 59px,
    rgba(210,214,220,0.22) 60px,
    rgba(210,214,220,0.22) 61px,
    transparent 62px
  ),
  linear-gradient(
    90deg,
    rgba(210,214,220,0.22) 0%,
    rgba(210,214,220,0.16) 35%,
    rgba(210,214,220,0.09) 70%,
    rgba(210,214,220,0.02) 100%
  ),
  linear-gradient(
    rgba(157,163,170,0.045) 1px,
    transparent 1px
  ),
  linear-gradient(
    90deg,
    rgba(157,163,170,0.045) 1px,
    transparent 1px
  ),
  radial-gradient(
    circle at 20% 20%,
    #1a1c1f,
    #0b0c0e
  );

background-size:
  100% 100%,
  100% 1px,
  60px 60px,
  60px 60px,
  100% 100%;

background-position:
  0 0,
  0 60px,
  0 0,
  0 0,
  0 0;

background-repeat:
  no-repeat,
  no-repeat,
  repeat,
  repeat,
  no-repeat;
          border-radius: 24px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 60px;
          box-sizing: border-box;
          font-family: system-ui;
          overflow: hidden;
          gap: 40px;
        }

        /* LEFT COLUMN */
        .left {
          width: 520px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          z-index: 2;
          transform: translateX(24px);
        }

        .slides {
          position: relative;
          height: 120px;
        }

        .slide {
          position: absolute;
           height: 150px;
          color: white;
          font-size: 32px;
          font-weight: 700;
          line-height: 1.2;
          opacity: 0;
          animation: slideFade 12s infinite;
        }

        .s1 { animation-delay: 0s; }
        .s2 { animation-delay: 4s; }
        .s3 { animation-delay: 8s; }

        @keyframes slideFade {
          0% { opacity: 0; }
          5% { opacity: 1; }
          30% { opacity: 1; }
          35% { opacity: 0; }
          100% { opacity: 0; }
        }

        /* CTA GLASS */
        .cta {
          margin-top: 30px;
          display: flex;
          gap: 14px;
        }

        .btn {
          padding: 10px 20px;
          border-radius: 10px;
          backdrop-filter: blur(10px);
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.15);
          color: white;
          text-decoration: none;
          font-size: 14px;
          font-weight: 500;
          transition: all 0.25s ease;
        }

        .btn:hover {
          background: rgba(59,130,246,0.2);
          border-color: rgba(59,130,246,0.5);
          box-shadow: 0 0 20px rgba(59,130,246,0.4);
        }

        /* RIGHT MOCKUP */
        .right {
          width: 420px;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .scene {
          width: 100%;
          height: 260px;
          perspective: 1200px;
        }

        .card {
          width: 100%;
          height: 100%;
          border-radius: 18px;
          transform-style: preserve-3d;
          transform: rotateY(-18deg) rotateX(10deg);
          background: linear-gradient(145deg, #24272b, #111315);
          box-shadow:
            0 40px 80px rgba(0,0,0,0.6),
            inset 0 0 40px rgba(255,255,255,0.05);
          overflow: hidden;
          position: relative;
          animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
          0% { transform: rotateY(-18deg) rotateX(10deg) translateY(0);}
          50% { transform: rotateY(-16deg) rotateX(10deg) translateY(-10px);}
          100% { transform: rotateY(-18deg) rotateX(10deg) translateY(0);}
        }

        /* SLIDING CONTENT INSIDE MOCKUP */
        .mock-content {
          position: absolute;
          bottom: -100%;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          padding: 20px;
          box-sizing: border-box;
          gap: 10px;
          animation: slideUp 12s infinite;
        }

        .mc1 { animation-delay: 0s; }
        .mc2 { animation-delay: 4s; }
        .mc3 { animation-delay: 8s; }

        @keyframes slideUp {
          0% { bottom: -100%; opacity: 0;}
          5% { bottom: 0%; opacity: 1;}
          30% { bottom: 0%; opacity: 1;}
          35% { bottom: 100%; opacity: 0;}
          100% { bottom: 100%; opacity: 0;}
        }

        /* colorful placeholder blocks */
        .block {
          height: 18px;
          border-radius: 6px;
        }

        .b1 { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
        .b2 { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
        .b3 { background: linear-gradient(90deg, #22c55e, #eab308); }

        .subtitle {
          display: block;
          margin-top: 10px;
          color: #9da3aa;
          font-size: 15px;
          font-weight: 400;
          line-height: 1.5;
        }

      </style>

      <div class="container">

        <div class="left">
          <div class="slides">
            <div class="slide s1">
              Build things that shouldn't be possible.
              <span class="subtitle">Turning complex ideas into clean, scalable software — from architecture to production.</span>
            </div>
              <div class="slide s2">
                From zero to production — fast. 
                <span class="subtitle">Prototyping, APIs, automation and deployment with a product-first engineering mindset.</span>
              </div>
              <div class="slide s3">
                Engineering clarity in chaotic systems.
                <span class="subtitle">Designing systems that are observable, maintainable and built to evolve.</span>
              </div>
          </div>
        </div>

        <div class="right">
          <div class="scene">
            <div class="card">

              <div class="mock-content mc1">
                <div class="block b1" style="width:90%"></div>
                <div class="block b1" style="width:70%"></div>
                <div class="block b1" style="width:50%"></div>
              </div>

              <div class="mock-content mc2">
                <div class="block b2" style="width:80%"></div>
                <div class="block b2" style="width:60%"></div>
                <div class="block b2" style="width:40%"></div>
              </div>

              <div class="mock-content mc3">
                <div class="block b3" style="width:85%"></div>
                <div class="block b3" style="width:65%"></div>
                <div class="block b3" style="width:45%"></div>
              </div>

            </div>
          </div>
        </div>

      </div>

    </div>
  </foreignObject>
</svg>
