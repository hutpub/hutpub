      </circle>

      <circle cx="900" cy="132" r="1.4" fill="#06b6d4">
        <animate attributeName="cx" values="-50;1250" dur="6.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.65;0" dur="6.8s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1050" cy="48" r="1.3" fill="#3b82f6">
        <animate attributeName="cx" values="-40;1240" dur="9.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="9.5s" repeatCount="indefinite"/>
