        <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
      </circle>

      <circle cx="300" cy="145" r="1.3" fill="#3b82f6">
        <animate attributeName="cx" values="-40;1240" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.65;0" dur="7.5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="600" cy="28" r="1.2" fill="#06b6d4">
