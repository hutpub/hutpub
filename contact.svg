<svg viewBox="0 0 1200 180" width="1200" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="15%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#24272b"/>
      <stop offset="55%" stop-color="#151719"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>

    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <clipPath id="clip">
      <rect width="1200" height="180" rx="24"/>
    </clipPath>
  </defs>

  <a href="https://www.linkedin.com/in/miika-huttunen" target="_blank">
    <rect width="1200" height="180" rx="24" fill="url(#bg)"/>

    <g clip-path="url(#clip)" opacity="0.5">
      <circle cx="20" cy="35" r="1.5" fill="url(#dot)">
        <animate attributeName="cx" values="-20;1220" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      </circle>

      <circle cx="180" cy="62" r="1.8" fill="url(#dot)">
