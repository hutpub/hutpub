    <text x="300" y="72"
      fill="#f5f5f5"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="25"
      font-weight="700">
      Does your software project need
    </text>

    <text x="300" y="103"
      fill="#f5f5f5"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="25"
      font-weight="700">
      a hands-on engineer?
    </text>

    <text x="300" y="130"
      fill="#9da3aa"
