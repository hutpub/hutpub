<svg viewBox="0 0 1200 180" width="1200" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern
      id="dotGrid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)">
      <circle cx="0" cy="0" r="1.2" fill="#f5f5f5"/>
    </pattern>
  
    <clipPath id="clip">
      <rect width="1200" height="180" rx="24"/>
    </clipPath>
  </defs>

  <a href="https://www.linkedin.com/in/miika-huttunen" target="_blank">
    <rect width="1200" height="180" rx="24" fill="#0b0c0e"/>

    <g clip-path="url(#clip)" opacity="0.35">
      <rect
        x="-500"
        y="-500"
        width="2200"
        height="1200"
        fill="url(#dotGrid)">
        <animateTransform
          attributeName="transform"
          type="translate"
          from="0 0"
          to="32 32"
          dur="2s"
          repeatCount="indefinite"/>
      </rect>
    </g>
    
    <text x="60" y="98"
      fill="#f5f5f5"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="1">
      YOUR COMPANY
    </text>

    <text x="300" y="72"
      fill="#f5f5f5"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="25"
      font-weight="700">
      Does your software project need
    </text>

    <text x="300" y="103"
      fill="#f5f5f5"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="25"
      font-weight="700">
      a hands-on engineer?
    </text>

    <text x="300" y="130"
      fill="#9da3aa"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="14"
      font-weight="400">
      From architecture to production — I build, integrate and ship.
    </text>

    <rect x="1000" y="67" width="140" height="48" rx="24" fill="#ffffff"/>

    <text x="1070" y="97"
      text-anchor="middle"
      fill="#111315"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="14"
      font-weight="700">
      CONTACT ME
    </text>
  </a>
</svg>
