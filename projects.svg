<svg viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          width: 1200px;
          height: 500px;
          box-sizing: border-box;
          padding: 42px 60px;
          border-radius: 0 0 24px 24px;
          background: #0b0c0e;
          color: #f5f5f5;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          overflow: hidden;
        }

        .header {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          margin-left: 24px;
          margin-right: 24px;
        }

        .title {
          font-size: 25px;
          font-weight: 700;
          letter-spacing: -0.4px;
        }

        .label {
          color: #777d84;
          font-family: monospace;
          font-size: 10px;
          letter-spacing: 1.8px;
        }
        
        .timeline {
          position: relative;
          height: 48px;
          margin: 28px 24px 20px;
        }
        
        .line {
          position: absolute;
          left: 0;
          right: 0;
          top: 23px;
          height: 1px;
          background: linear-gradient(
            90deg,
            rgba(245,245,245,0.15),
            rgba(245,245,245,0.5) 50%,
            rgba(245,245,245,0.15)
          );
        }
        
        .points {
          position: absolute;
          inset: 0;
        }
        
        .point {
          position: absolute;
          top: 0;
          width: 46px;
          height: 46px;
          box-sizing: border-box;
          border: 1px solid rgba(245,245,245,0.28);
          border-radius: 50%;
          background: #0b0c0e;
          display: flex;
          align-items: center;
          justify-content: center;
          transform: translateX(-50%);
        }
        
        .point:nth-child(1) {
          left: 123.75px;
        }
        
        .point:nth-child(2) {
          left: 385.25px;
        }
        
        .point:nth-child(3) {
          left: 646.75px;
        }
        
        .point:nth-child(4) {
          left: 908.25px;
        }
        
        .point::after {
          content: "";
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #f5f5f5;
        }
        
        .projects {
          display: flex;
          gap: 14px;
          margin: 0 24px;
        }

       .project {
        width: calc((100% - 42px) / 4);
        height: 280px;
        box-sizing: border-box;
        padding: 20px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        background: linear-gradient(
          145deg,
          rgba(255,255,255,0.055),
          rgba(255,255,255,0.018)
        );
        display: flex;
        flex-direction: column;
      }
      
      .project-number {
        color: #777d84;
        font-family: monospace;
        font-size: 10px;
        letter-spacing: 1px;
        margin-bottom: 18px;
      }
      
      .project-title {
        height: 48px;
        flex-shrink: 0;
        font-size: 17px;
        line-height: 1.25;
        font-weight: 650;
        letter-spacing: -0.2px;
      }
      
      .project-description {
        height: 48px;
        flex-shrink: 0;
        margin-top: 9px;
        color: #9da3aa;
        font-size: 11px;
        line-height: 1.45;
      }
      
      .tech {
        margin-top: 17px;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.08);
        color: #777d84;
        font-family: monospace;
        font-size: 9px;
        line-height: 1.65;
      }

        .tech strong {
          color: #b8bdc3;
          font-weight: 500;
        }
      </style>

      <div class="container">

        <div class="header">
          <div class="title">Recent Projects</div>
        </div>

        <div class="timeline">
          <div class="line"></div>
          <div class="points">
            <div class="point"></div>
            <div class="point"></div>
            <div class="point"></div>
            <div class="point"></div>
          </div>
        </div>

        <div class="projects">

          <div class="project">
            <div class="project-number">2026</div>
            <div class="project-title">Workforce &amp; Business Platform</div>
            <div class="project-description">
              Platform and business management, employee portal and customer mobile app.
            </div>
            <div class="tech">
              <strong>STACK</strong><br/>
              Next.js · Fastify.js · Postgres · Drizzle ORM · Fly.io · Supabase · Firebase · Flutter · Kotlin · Swift · Vercel
            </div>
          </div>

          <div class="project">
            <div class="project-number">2025</div>
            <div class="project-title">Gig Worker Payroll</div>
            <div class="project-description">
              Payroll system for gig workers with a mobile app and business dashboard.
            </div>
            <div class="tech">
              <strong>STACK</strong><br/>
              Next.js · Flutter · Rust · Google Cloud · Vercel
            </div>
          </div>

          <div class="project">
            <div class="project-number">2025</div>
            <div class="project-title">Business Service Search</div>
            <div class="project-description">
              Search platform for discovering and finding relevant business services.
            </div>
            <div class="tech">
              <strong>STACK</strong><br/>
              Next.js · Supabase · Vercel
            </div>
          </div>

          <div class="project">
            <div class="project-number">2024</div>
            <div class="project-title">Queue-Free Payments Infrastructure</div>
            <div class="project-description">
              Platform and merchant dashboards, lightweight PMS/ERP and consumer mobile app.
            </div>
            <div class="tech">
              <strong>STACK</strong><br/>
              Next.js · Flutter · Firebase · Postgres · Prisma · Express.js · Verifone · Stripe · Redis · AWS
            </div>
          </div>

        </div>

      </div>
    </div>
  </foreignObject>
</svg>
